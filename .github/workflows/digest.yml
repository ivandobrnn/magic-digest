name: Дайджест фокусов
on:
  push:
    paths: ['digest.py', 'requirements.txt', '.github/workflows/digest.yml']
  schedule:
    - cron: '17 6 * * *'
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Режим запуска
        type: choice
        options: [preview, test, publish, button]
        default: preview
permissions:
  contents: write
concurrency:
  group: magic-digest
  cancel-in-progress: false
jobs:
  digest:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python digest.py
        env:
          MODE: ${{ inputs.mode || (github.event.schedule == '17 6 * * *' && 'schedule' || github.event_name == 'schedule' && 'poll' || 'preview') }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
