name: Дайджест фокусов
on:
  push:
    paths: ['digest.py', 'MAGIC_SHOPS.md', 'requirements.txt', '.github/workflows/digest.yml']
  schedule:
    - cron: '17 6 * * *'
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Режим запуска
        type: choice
        options: [preview, test, publish, button, webhook]
        default: preview
      button_message_id:
        description: ID сообщения с кнопкой (заполняется Worker)
        type: string
        required: false
permissions:
  contents: write
concurrency:
  group: magic-digest
  cancel-in-progress: false
jobs:
  digest:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event.schedule != '2,12,22,32,42,52 * * * *' || vars.TELEGRAM_WEBHOOK_URL == '')
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python digest.py
        env:
          MODE: ${{ inputs.mode || (github.event.schedule == '17 6 * * *' && 'schedule' || github.event_name == 'schedule' && 'poll' || 'preview') }}
          BUTTON_MESSAGE_ID: ${{ inputs.button_message_id }}
          TELEGRAM_WEBHOOK_URL: ${{ vars.TELEGRAM_WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.TELEGRAM_WEBHOOK_SECRET }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
